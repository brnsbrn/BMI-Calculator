<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BodyFit — Browser Tests</title>
  <style>
    body { font: 15px/1.6 system-ui, sans-serif; background: #f4f8f5; color: #173f35; padding: 24px; }
    h1 { font-size: 26px; }
    #summary { font-weight: bold; }
    #output { white-space: pre-wrap; }
    iframe { display: block; height: 1100px; border: 1px solid #b9cfc5; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>BodyFit — Browser Tests</h1>
  <p>Pengujian halaman kalkulator sebenarnya, dengan data sintetis. Data browser yang sudah ada dipulihkan sesudah pengujian.</p>
  <pre id="output"></pre>
  <p id="summary" role="status">Pengujian berjalan…</p>
  <iframe id="calculator" title="Kalkulator yang diuji" style="width:1400px"></iframe>
  <script type="module">
    import { exportJson, STORAGE_KEY } from './js/storage.js?v=calculator-only-14';
    import { buildAssessment } from './js/calculator/assessment.js?v=calculator-only-14';
    const frame = document.getElementById('calculator');
    const output = document.getElementById('output');
    const saved = localStorage.getItem(STORAGE_KEY);
    const savedTheme = localStorage.getItem('bodyfit-theme');
    let passed = 0, failed = 0;
    let doc;
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    const waitFor = async (predicate) => {
      for (let i = 0; i < 150; i++) {
        if (predicate()) return;
        await new Promise((resolve) => setTimeout(resolve, 40));
      }
      throw new Error('Timeout menunggu halaman');
    };
    async function test(name, run) {
      try { await run(); passed++; output.textContent += 'PASS ' + name + '\n'; }
      catch (error) { failed++; output.textContent += 'FAIL ' + name + ': ' + error.message + '\n'; }
    }
    async function load(path = 'index.html') {
      await new Promise((resolve, reject) => {
        frame.onload = resolve;
        frame.onerror = reject;
        frame.src = path;
      });
      doc = frame.contentDocument;
      await waitFor(() => doc.querySelector('#app-sidebar') && doc.querySelector('#calculator-form'));
    }
    function set(id, value) {
      const element = doc.getElementById(id);
      element.value = value;
      element.dispatchEvent(new frame.contentWindow.Event('input', { bubbles: true }));
    }
    function fill({ gender = 'male', age = 30, weight = 70, height = 175, waist = 85, hip = 100, targetWeight = '' } = {}) {
      doc.querySelector('[data-value="' + gender + '"]').click();
      for (const [id, value] of Object.entries({ age, weight, height, waist, hip, targetWeight })) set(id, value);
    }
    function calculate() { doc.getElementById('btn-calculate').click(); }
    const result = (name) => doc.querySelector('[data-result="' + name + '"]')?.textContent;
    try {
      localStorage.removeItem(STORAGE_KEY);
      await load();
      await test('Hanya navigasi Kalkulator pada desktop dan ponsel', () => {
        for (const nav of doc.querySelectorAll('.sidebar-nav, .nav-desktop, #mobile-menu')) {
          assert(nav.querySelectorAll('a.nav-link').length === 1, 'Jumlah tautan navigasi');
          assert(nav.querySelector('a.nav-link').textContent.includes('Kalkulator'), 'Tautan bukan kalkulator');
        }
        assert(!doc.getElementById('neck') && !doc.getElementById('activityLevel'), 'Input lama masih ada');
      });
      await test('Submit kosong menampilkan validasi dan tidak menghasilkan angka', () => {
        calculate();
        assert(!doc.getElementById('gender-error').hidden, 'Jenis kelamin belum divalidasi');
        assert(!doc.getElementById('height-error').hidden, 'Tinggi belum divalidasi');
        assert(doc.getElementById('result-content').hidden, 'Hasil semestinya kosong');
      });
      await test('Pria tanpa lingkar leher: BMI, RFM, rasio dan target otomatis benar', () => {
        fill(); calculate();
        assert(result('bmi').includes('22,86'), 'BMI salah: ' + result('bmi'));
        assert(result('body-fat') === '22,8%', 'RFM salah: ' + result('body-fat'));
        assert(result('waist-hip-ratio') === '0,85', 'Rasio salah');
        assert(result('target') === '70,0 kg', 'Target pemeliharaan salah');
        assert(!doc.getElementById('result-content').textContent.includes('NaN'), 'NaN pada hasil');
      });
      await test('Perubahan input menyembunyikan hasil lama lalu menghitung ulang', () => {
        set('weight', 90);
        assert(doc.getElementById('result-content').hidden, 'Hasil lama masih terlihat');
        set('targetWeight', 75); calculate();
        assert(result('bmi').includes('29,39'), 'BMI tidak diperbarui');
        assert(result('target') === '75,0 kg', 'Target manual tidak diperbarui');
      });
      await test('Wanita dapat menghitung tanpa input leher', () => {
        fill({ gender: 'female', height: 170, waist: 85 }); calculate();
        assert(result('body-fat') === '36,0%', 'RFM wanita salah');
        assert(result('bmi').includes('24,22'), 'BMI wanita salah');
      });
      await test('Input lingkar dan target opsional tetap menghasilkan BMI', () => {
        fill({ waist: '', hip: '' }); calculate();
        assert(result('bmi').includes('22,86'), 'BMI hilang');
        assert(result('waist-hip-ratio') === 'Belum tersedia', 'Rasio semestinya kosong');
        assert(doc.getElementById('result-content').textContent.includes('Deurenberg'), 'Metode fallback tidak dijelaskan');
      });
      await test('Tinggi wajib dan tidak digantikan ukuran lingkar', () => {
        set('height', ''); calculate();
        assert(!doc.getElementById('height-error').hidden, 'Tinggi kosong diterima');
        assert(doc.getElementById('result-content').hidden, 'Hasil lama tidak dibersihkan');
      });
      await test('Kategori menggunakan BMI sebelum pembulatan', () => {
        fill({ height: 200, weight: 99.99 }); calculate();
        assert(result('category') === 'Normal', '24.9975 dibulatkan sebelum kategori');
      });
      await test('Penurunan target ditolak saat BMI kurang', () => {
        fill({ height: 167, weight: 42, targetWeight: 40 }); calculate();
        assert(!doc.getElementById('targetWeight-error').hidden, 'Target berbahaya diterima');
        assert(doc.getElementById('result-content').hidden, 'Hasil masih terlihat');
      });
      await test('Estimasi lemak di luar rentang tidak menggagalkan BMI', () => {
        fill({ height: 180, waist: 40 }); calculate();
        assert(result('body-fat') === 'Tidak tersedia', 'Estimasi dipaksa ke batas');
        assert(result('bmi').includes('21,60'), 'BMI gagal');
      });
      await test('Desktop tidak meluap secara horizontal', () => {
        assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth + 1, 'Desktop overflow');
      });
      await test('Layar 390px menampilkan form dan hasil tanpa overflow', async () => {
        frame.style.width = '390px';
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth + 1, 'Mobile overflow');
        assert(doc.querySelector('#calculator-form').getBoundingClientRect().width <= 390, 'Form terlalu lebar');
        fill({ gender: 'female' }); calculate();
        assert(result('bmi').includes('22,86'), 'Kalkulasi mobile gagal');
      });
      await test('Tentang aplikasi menjelaskan kalkulator tanpa fitur lama', () => {
        doc.getElementById('about-button').click();
        const modal = doc.querySelector('.modal');
        assert(modal.textContent.includes('RFM'), 'Metode tidak dijelaskan');
        assert(!/Halaman Progres|Check-in|rencana nutrisi/.test(modal.textContent), 'Deskripsi fitur lama');
        modal.querySelector('[data-modal-close]').click();
      });
      await test('Impor lewat dialog langsung memulihkan input dan hasil', async () => {
        const backup = exportJson({ version: 2, assessment: buildAssessment({ gender: 'female', age: 35, weight: 65, height: 165, waist: 80, hip: 95, targetWeight: 60 }) });
        doc.getElementById('btn-import').click();
        const input = doc.getElementById('import-file-input');
        const transfer = new frame.contentWindow.DataTransfer();
        transfer.items.add(new frame.contentWindow.File([backup], 'test-backup.json', { type: 'application/json' }));
        input.files = transfer.files;
        input.dispatchEvent(new frame.contentWindow.Event('change', { bubbles: true }));
        await waitFor(() => !doc.getElementById('import-confirm').hidden);
        doc.getElementById('import-confirm').click();
        await waitFor(() => doc.getElementById('weight').value === '65');
        assert(doc.getElementById('weight').value === '65', 'Input tidak dipulihkan');
        assert(result('bmi').includes('23,88'), 'Hasil impor salah');
        assert(result('target') === '60,0 kg', 'Target impor salah');
      });
      await test('Konfirmasi reset benar-benar membersihkan kalkulator', async () => {
        doc.getElementById('btn-reset').click();
        doc.querySelector('[data-modal-confirm]').click();
        await waitFor(() => doc.getElementById('weight').value === '');
        assert(doc.getElementById('weight').value === '', 'Form belum kosong');
        assert(doc.getElementById('result-content').hidden, 'Hasil belum kosong');
      });
      for (const path of ['plan.html', 'progress.html', 'check-in.html']) {
        await test(path + ' dialihkan ke kalkulator', async () => {
          await new Promise((resolve) => {
            frame.onload = () => {
              if (frame.contentWindow.location.pathname.endsWith('/index.html')) resolve();
            };
            frame.src = path;
          });
          await waitFor(() => {
            try { return frame.contentWindow.location.pathname.endsWith('/index.html') && frame.contentDocument.querySelector('#app-sidebar'); }
            catch { return false; }
          });
          assert(frame.contentWindow.location.pathname.endsWith('/index.html'), 'Tidak dialihkan');
        });
      }
    } catch (error) {
      failed++;
      output.textContent += 'FAIL setup: ' + error.message + '\n';
    } finally {
      if (saved === null) localStorage.removeItem(STORAGE_KEY); else localStorage.setItem(STORAGE_KEY, saved);
      if (savedTheme === null) localStorage.removeItem('bodyfit-theme'); else localStorage.setItem('bodyfit-theme', savedTheme);
      document.getElementById('summary').textContent = passed + ' passed, ' + failed + ' failed';
      document.documentElement.dataset.testStatus = failed ? 'failed' : 'passed';
    }
  </script>
</body>
</html>
